# ---------------------------------------------------------------------------
# SEARCH QUERIES — fed to each enabled Apify platform (one actor run each).
# Kept deliberately small to control Apify cost; add more to widen the net.
# ---------------------------------------------------------------------------
search_queries:
  - AI Product Manager
  - Generative AI Product Manager
  - Technical Product Manager AI
  - Applied AI Product Manager
  - AI Solutions Engineer
  - Forward Deployed Engineer

# Default location string handed to location-aware actors.
default_location: India

# ---------------------------------------------------------------------------
# PLATFORMS — Apify actors, one entry per board.
#
# Only LinkedIn + Indeed are enabled by default: their actors are well-known
# and their output schemas are covered by the default field map, so they work
# out of the box. The rest are pre-wired but DISABLED — flip `enabled: true`
# once you've confirmed the actor id + output fields with:
#     APIFY_TOKEN=... python scripts/test_apify.py <platform> "AI Product Manager"
# and, if a field shows up MISSING, extend that platform's `fields` map.
#
# `input` is the actor run-input; the strings "{query}" and "{location}" are
# substituted per search query. `fields` maps our canonical columns to the
# candidate output keys the parser tries in order (platform-specific keys are
# merged over the global defaults in discovery.py).
# ---------------------------------------------------------------------------
platforms:
  - name: linkedin
    enabled: true
    actor: "bebity~linkedin-jobs-scraper"
    results_per_query: 25
    input:
      title: "{query}"
      location: "{location}"
      rows: 25
      publishedAt: "r604800"      # past 7 days (actor-specific; best effort)
    fields:
      title: [title, jobTitle, positionName]
      company: [companyName, company]
      location: [location, place]
      url: [jobUrl, link, url]
      description: [description, descriptionText, descriptionHtml]
      posted: [postedTime, publishedAt, postedAt, listedAt, datePosted]
      salary: [salaryInfo, salary]
      seniority: [seniorityLevel, seniority, experienceLevel]

  - name: indeed
    enabled: true
    actor: "misceres~indeed-scraper"
    results_per_query: 25
    input:
      position: "{query}"
      country: IN
      location: "{location}"
      maxItems: 25
      parseCompanyDetails: false
    fields:
      title: [positionName, title]
      company: [company, companyName]
      location: [location]
      url: [url, externalApplyLink]
      description: [description, descriptionText]
      posted: [postingDateParsed, postedAt, date]
      salary: [salary]

  # --- pre-wired, disabled until actor + schema confirmed -------------------
  - name: naukri
    enabled: false
    actor: "memo23~apify-naukri-scraper"       # confirm / replace
    results_per_query: 25
    input:
      keyword: "{query}"
      location: "{location}"
      maxItems: 25
    fields: {}

  - name: foundit
    enabled: false
    actor: ""                                   # set an actor id to enable
    results_per_query: 25
    input:
      query: "{query}"
      location: "{location}"
    fields: {}

  - name: wellfound
    enabled: false
    actor: ""                                   # e.g. an AngelList/Wellfound actor
    results_per_query: 25
    input:
      query: "{query}"
    fields: {}

  - name: instahyre
    enabled: false
    actor: ""
    results_per_query: 25
    input:
      query: "{query}"
      location: "{location}"
    fields: {}

  - name: glassdoor
    enabled: false
    actor: ""
    results_per_query: 25
    input:
      query: "{query}"
      location: "{location}"
    fields: {}

# ---------------------------------------------------------------------------
# ATS CAREER PAGES — scraped directly from each provider's public JSON API
# (no Apify, no cost). This is where the AI-native targets post first.
# `slug` is the company's board identifier in that provider's URL; confirm
# each one (they vary) — a wrong slug just 404s and is skipped with a note.
# ---------------------------------------------------------------------------
ats_boards:
  greenhouse:
