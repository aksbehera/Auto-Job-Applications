# ---------------------------------------------------------------------------
# Job search configuration — AI / Technical Product Manager, India-focused.
#
# Everything the pipeline uses to decide *what to look for*, *what to keep*,
# and *how to rank* lives here. Edit this file, not the Python, to tune the
# search. Lists are matched case-insensitively against job titles / companies.
# ---------------------------------------------------------------------------

# How recent a posting must be to count (days). Older roles are dropped.
recency_days: 14
# Target number of roles per digest email (quality over firehose).
max_items_per_digest: 25
# Re-run the weekly requirements analysis only if this many days have passed
# since the last one (cadence is tracked in the Sheet's _meta tab).
weekly_interval_days: 7

# ---------------------------------------------------------------------------
# THE LANE — role titles we want, ranked by closeness.
# A role scores on how well its title matches these exemplars.
# ---------------------------------------------------------------------------
target_titles:
  - AI Product Manager
  - Generative AI Product Manager
  - GenAI Product Manager
  - Applied AI Product Manager
  - AI Product Lead
  - Technical Product Manager
  - Technical Product Manager AI
  - Principal AI Product Manager
  - Senior AI Product Manager
  - Group Product Manager AI
  - Director of AI Product
  - AI Solutions Engineer
  - Forward Deployed Engineer
  - Forward Deployed Solutions Engineer
  - AI Solutions Architect

# Signal vocabularies used by the rule-based classifier.
# A role is "in the lane" if it carries a product/solutions signal AND an AI
# signal (in the title, or AI in the title's company/description).
pm_terms:
  - product manager
  - product management
  - product lead
  - product owner
  - head of product
  - group product manager
  - director of product
  - director, product
  - vp product
  - principal product
  - staff product
  - product director
solutions_terms:
  - solutions engineer
  - forward deployed
  - forward-deployed
  - solutions architect
  - solution architect
  - solutions consultant
ai_terms:
  - ai
  - a.i.
  - genai
  - gen ai
  - generative ai
  - llm
  - large language model
  - applied ai
  - agentic
  - machine learning   # only counts toward AI signal, never as a PM/SE signal
  - ml

# ---------------------------------------------------------------------------
# EXCLUSIONS — drop a role if its title matches any of these, UNLESS it also
# carries a strong product/solutions signal (handled in classify.py).
# ---------------------------------------------------------------------------
exclude_titles:
  - data scientist
  - data science
  - machine learning engineer
  - ml engineer
  - mlops
  - ml ops
  - deep learning engineer
  - research scientist
  - research engineer
  - software engineer
  - software development engineer
  - sde
  - backend engineer
  - frontend engineer
  - full stack
  - fullstack
  - data engineer
  - data analyst
  - business analyst
  - product marketing
  - marketing manager
  - program manager
  - programme manager
  - project manager
  - delivery manager
  - scrum master
  - sales manager
  - account executive
  - customer success
  - designer
  - ux researcher
  - intern
  - internship

# Phrases in the JD body that flag a code/DSA-gated bar (used to down-rank or
# drop "AI Solutions Engineer / Forward-Deployed" roles that are really SWE).
code_gate_terms:
  - data structures and algorithms
  - leetcode
  - competitive programming
  - live coding round
  - coding round
  - dsa round

# ---------------------------------------------------------------------------
# SENIORITY — I'm a manager now; mid → senior / lead / manager level.
# ---------------------------------------------------------------------------
