name: Job Digest

on:
  schedule:
    # Every 2 days at 03:30 UTC = 09:00 IST.
    - cron: "30 3 */2 * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Which profile to run (both, akshit, deepanshi)"
        type: choice
        default: both
        options: [both, akshit, deepanshi]
      dry_run:
        description: "Dry run (render only, no Sheet write, no email)"
        type: boolean
        default: false
  # Fire an on-demand real run for BOTH profiles by committing any change to
  # .github/fire-digest. Ordinary code pushes don't touch it, so they never send.
  push:
    paths:
      - ".github/fire-digest"

# Each person's Google Sheet is the system of record; nothing is committed back.
permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one person's run failing must not cancel the other
      matrix:
        profile: [akshit, deepanshi]
    concurrency:
      group: job-digest-${{ matrix.profile }}
      cancel-in-progress: false
    steps:
      # Skip the profiles not chosen in a manual dispatch (schedule/fire run both).
      - name: Should this profile run?
        id: gate
        run: |
          want="${{ github.event.inputs.profile }}"
          if [ -z "$want" ] || [ "$want" = "both" ] || [ "$want" = "${{ matrix.profile }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run job digest (${{ matrix.profile }})
        if: steps.gate.outputs.run == 'true'
        env:
          JOB_PROFILE: ${{ matrix.profile }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Sheet id and recipient come from profiles/<profile>/targets.yaml.
        run: |
          FLAGS="--profile ${{ matrix.profile }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          python run_scraper.py $FLAGS

      - name: Upload dry-run output
        if: ${{ steps.gate.outputs.run == 'true' && inputs.dry_run == true }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.profile }}
          path: out/digest_${{ matrix.profile }}.html
          if-no-files-found: ignore
