# ---------------------------------------------------------------------------
# LOCATIONS — priority order baked into scoring/grouping.
#   1. Remote (India-eligible / global-remote hiring in India)  — top
#   2. India on-site / hybrid, any city                         — next
#   3. International — only if remote-eligible OR a target company
# ---------------------------------------------------------------------------
india_terms:
  - india
  - bengaluru
  - bangalore
  - hyderabad
  - gurugram
  - gurgaon
  - delhi
  - new delhi
  - noida
  - ncr
  - pune
  - mumbai
  - chennai
  - kolkata
  - ahmedabad
remote_terms:
  - remote
  - work from home
  - work-from-home
  - wfh
  - anywhere
  - distributed
  - fully remote
  - remote-first

# ---------------------------------------------------------------------------
# SEARCH QUERIES — fed to each enabled Apify platform (one actor run each).
# Kept deliberately small to control Apify cost; add more to widen the net.
# ---------------------------------------------------------------------------
search_queries:
  - AI Product Manager
  - Generative AI Product Manager
  - Technical Product Manager AI
  - Applied AI Product Manager
  - AI Solutions Engineer

# Default location string handed to location-aware actors.
default_location: India

# ---------------------------------------------------------------------------
# PLATFORMS — which shared actors to run (defined in profiles/platforms.yaml).
# Flip the list to add/remove a job portal. `platform_overrides` tweaks a
# platform's input for this profile (e.g. Instahyre's job-function slug).
# ---------------------------------------------------------------------------
platforms_enabled: [linkedin, indeed, naukri, foundit, wellfound, instahyre, iimjobs]
platform_overrides:
  instahyre:
    input:
      jobFunctionSlugs: ["product-management"]

# ---------------------------------------------------------------------------
# ATS CAREER PAGES — scraped directly from each provider's public JSON API
# (no Apify, no cost). This is where the AI-native targets post first.
# `slug` is the company's board identifier in that provider's URL; confirm
# each one (they vary) — a wrong slug just 404s and is skipped with a note.
# ---------------------------------------------------------------------------
ats_boards:
  greenhouse:
    - { company: Databricks, slug: databricks }
    - { company: Anthropic,  slug: anthropic }
    - { company: Glean,      slug: gleanwork }
    - { company: Gong,       slug: gongio }
    - { company: Observe.ai, slug: observeai }
    - { company: Cresta,     slug: cresta }
  ashby:
    - { company: Sierra,     slug: sierra }
    - { company: Decagon,    slug: decagon }
    - { company: OpenAI,     slug: openai }
    - { company: ElevenLabs, slug: elevenlabs }
    - { company: Cognition,  slug: cognition }
    - { company: Writer,     slug: writer }
    - { company: Cohere,     slug: cohere }
    - { company: Mistral,    slug: mistral.ai }
    - { company: Runway,     slug: runway-ml }
    - { company: Perplexity, slug: perplexity }
  lever: []
  # Clari omitted: its careers page redirects off-domain and exposes no public
  # Greenhouse/Lever/Ashby board. It'll still be caught via LinkedIn/Naukri.
