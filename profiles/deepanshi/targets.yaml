# ---------------------------------------------------------------------------
# Job search configuration — Sales / Revenue leadership, India-focused.
# Edit this file, not the Python, to tune the search.
# ---------------------------------------------------------------------------

# --- Profile identity (per person; keeps this search fully separate) ---------
sheet_id: "1weoLH0-AF1QDCWF5pvEuxb_WK3ulA_4BmPsoC5CU1MQ"
digest_recipient: "deepanshibajpai2@gmail.com"
digest_title: "Sales Job Digest"
scoring_system: >-
  You are a sharp sales recruiter scoring commercial / revenue roles for one
  specific candidate. Judge TRUE fit by reading the job description's must-have
  requirements, never by the title alone — a sales-sounding title can still be a
  misfit, and a non-sales title can own revenue. Takeability from India is
  decisive: a role she cannot physically take from India now must never score like
  one she can. Be decisive and honest. Return only JSON.

# Her lane is sales/revenue, which carries no "AI" style domain gate — any
# sales/BD-titled role passes the cheap pre-filter and the LLM judges real fit.
require_domain_signal: false

# She targets big reputable MNCs/brands and is industry-agnostic, so company
# brand/quality is weighted heavily and domain (which industry) lightly.
weights:
  role_type: 30      # senior managerial sales leadership vs low-level calling/coordination
  company: 25        # big reputable MNC/brand (high) vs small/unknown/staffing (low)
  seniority: 15
  location: 15
  domain: 10         # industry-agnostic — conversions ownership matters, sector less so
  feasibility: 5

recency_days: 14
max_items_per_digest: 25
weekly_interval_days: 7

# ---------------------------------------------------------------------------
